<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1E293B" border-bottom="1px solid #334155"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="14" fill="#3B82F6"/>
  <text x="31" y="37" fill="#FFFFFF" font-size="14" font-weight="bold">AI</text>
  <text x="62" y="38" fill="#F8FAFC" font-size="16" font-weight="600">InternalBuilder Studio</text>
  <rect x="230" y="20" width="130" height="24" rx="12" fill="#334155"/>
  <text x="242" y="36" fill="#94A3B8" font-size="12">Workspace: Operations</text>
  <rect x="1050" y="18" width="110" height="28" rx="6" fill="#334155"/>
  <text x="1066" y="36" fill="#E2E8F0" font-size="12">Role: ops_analyst</text>

  <!-- Canvas Background Wireframe -->
  <rect x="40" y="94" width="1120" height="666" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="500" y="440" fill="#475569" font-size="18" font-weight="500">Empty Application Canvas</text>

  <!-- Centered AI Assistant Modal -->
  <g filter="url(#shadow)">
    <rect x="240" y="130" width="720" height="540" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Modal Header -->
    <rect x="240" y="130" width="720" height="64" rx="16" fill="#1E293B"/>
    <circle cx="274" cy="162" r="12" fill="#3B82F6" opacity="0.2"/>
    <circle cx="274" cy="162" r="6" fill="#60A5FA"/>
    <text x="296" y="167" fill="#F8FAFC" font-size="16" font-weight="600">AI Draft Assistant</text>
    <rect x="440" y="152" width="60" height="20" rx="4" fill="#22C55E" opacity="0.2"/>
    <text x="449" y="166" fill="#4ADE80" font-size="11" font-weight="600">v1.0 MVP</text>
    <text x="925" y="167" fill="#94A3B8" font-size="18" cursor="pointer">✕</text>
    <line x1="240" y1="194" x2="960" y2="194" stroke="#334155" stroke-width="1"/>

    <!-- Data Source Selector -->
    <text x="274" y="228" fill="#94A3B8" font-size="13" font-weight="500">CONNECTED DATA SOURCE</text>
    <rect x="274" y="240" width="652" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="292" y="266" fill="#F8FAFC" font-size="14">⚡ PostgreSQL: Brazilian E-Commerce (Olist DB)</text>
    <text x="895" y="266" fill="#64748B" font-size="12">▼</text>

    <!-- Prompt Input Box -->
    <text x="274" y="318" fill="#94A3B8" font-size="13" font-weight="500">WHAT TOOL WOULD YOU LIKE TO BUILD?</text>
    <rect x="274" y="330" width="652" height="100" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="292" y="362" fill="#F8FAFC" font-size="15" font-weight="500">Build an approvals dashboard from orders with pending delivery</text>
    <text x="292" y="415" fill="#64748B" font-size="12">Press Enter or click Generate Draft below</text>

    <!-- Starter Prompts Section -->
    <text x="274" y="462" fill="#94A3B8" font-size="13" font-weight="500">OR SELECT A STARTER PROMPT MATCHED TO YOUR DATA:</text>
    
    <!-- Starter Pill 1 -->
    <rect x="274" y="478" width="230" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="290" y="499" fill="#93C5FD" font-size="12">✦ Order Fulfillment Queue</text>
    
    <!-- Starter Pill 2 -->
    <rect x="514" y="478" width="210" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="530" y="499" fill="#93C5FD" font-size="12">✦ Delayed Delivery Alert View</text>
    
    <!-- Starter Pill 3 -->
    <rect x="734" y="478" width="192" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="748" y="499" fill="#93C5FD" font-size="12">✦ Payment Method Breakdown</text>

    <!-- Starter Pill 4 & 5 -->
    <rect x="274" y="518" width="200" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="290" y="539" fill="#93C5FD" font-size="12">✦ Canceled Orders Triage</text>
    <rect x="484" y="518" width="230" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="500" y="539" fill="#93C5FD" font-size="12">✦ Product Freight Ratio Table</text>

    <!-- Footer Controls -->
    <line x1="240" y1="586" x2="960" y2="586" stroke="#334155" stroke-width="1"/>
    <text x="274" y="624" fill="#64748B" font-size="12">Zero customer row data sent to model. Governed by workspace RBAC.</text>
    
    <rect x="786" y="602" width="140" height="42" rx="8" fill="url(#gradPrimary)"/>
    <text x="808" y="628" fill="#FFFFFF" font-size="14" font-weight="600">Generate Draft →</text>
  </g>
</svg>
