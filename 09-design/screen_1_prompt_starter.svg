<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Blue button gradient -->
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Modal glass gradient -->
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <!-- Sidebar gradient -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Metric card gradients -->
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Modal shadow -->
    <filter id="modalShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <!-- Blue glow -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#3B82F6" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip paths -->
    <clipPath id="navClip">
      <rect width="1440" height="64"/>
    </clipPath>
    <clipPath id="sideClip">
      <rect x="0" y="64" width="220" height="836"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BACKGROUND                                    -->
  <!-- ═══════════════════════════════════════════ -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#grid)" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- TOP NAVIGATION BAR                           -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="0" y="0" width="1440" height="64" fill="#111827" clip-path="url(#navClip)"/>
  <line x1="0" y1="64" x2="1440" y2="64" stroke="#1F2937" stroke-width="1"/>

  <!-- Logo area -->
  <rect x="0" y="0" width="220" height="64" fill="#0D1526"/>
  <circle cx="28" cy="32" r="16" fill="#1E3A8A" opacity="0.6"/>
  <circle cx="28" cy="32" r="10" fill="#3B82F6"/>
  <!-- AI text in logo -->
  <text x="23" y="37" fill="#FFFFFF" font-size="11" font-weight="800" letter-spacing="-0.5">AI</text>
  <text x="46" y="38" fill="#F1F5F9" font-size="14" font-weight="700" letter-spacing="-0.3">InternalBuilder</text>
  <line x1="220" y1="0" x2="220" y2="64" stroke="#1F2937" stroke-width="1"/>

  <!-- Nav breadcrumb -->
  <text x="240" y="35" fill="#475569" font-size="13">Operations Workspace</text>
  <text x="380" y="35" fill="#334155" font-size="13">/</text>
  <text x="394" y="35" fill="#94A3B8" font-size="13">New Application</text>

  <!-- Nav right actions -->
  <!-- Notification bell -->
  <rect x="1220" y="20" width="36" height="36" rx="8" fill="#1E293B"/>
  <text x="1229" y="44" fill="#94A3B8" font-size="18">🔔</text>
  <!-- Avatar -->
  <circle cx="1330" cy="32" r="18" fill="#1E3A8A"/>
  <text x="1322" y="37" fill="#93C5FD" font-size="14" font-weight="600">SR</text>
  <!-- Role badge -->
  <rect x="1270" y="21" width="42" height="22" rx="11" fill="#1E3A8A"/>
  <text x="1280" y="36" fill="#93C5FD" font-size="10" font-weight="600">ops_analyst</text>
  <!-- Help -->
  <rect x="1358" y="20" width="36" height="36" rx="8" fill="#1E293B"/>
  <text x="1368" y="44" fill="#94A3B8" font-size="18">?</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT SIDEBAR                                 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="0" y="64" width="220" height="836" fill="url(#sideGrad)"/>
  <line x1="220" y1="64" x2="220" y2="900" stroke="#1F2937" stroke-width="1"/>

  <!-- Sidebar section: WORKSPACE -->
  <text x="20" y="104" fill="#475569" font-size="10" font-weight="600" letter-spacing="1.2">WORKSPACE</text>

  <!-- Active nav item: New App Builder -->
  <rect x="8" y="112" width="204" height="38" rx="8" fill="#1E3A8A" opacity="0.5"/>
  <rect x="8" y="112" width="3" height="38" rx="2" fill="#3B82F6"/>
  <text x="26" y="136" fill="#93C5FD" font-size="13" font-weight="600">✦ New App Builder</text>

  <!-- Other nav items -->
  <text x="26" y="172" fill="#64748B" font-size="13">⊞ My Applications</text>
  <text x="26" y="206" fill="#64748B" font-size="13">⚡ Data Sources</text>
  <text x="26" y="240" fill="#64748B" font-size="13">👥 Team Access</text>
  <text x="26" y="274" fill="#64748B" font-size="13">📋 Audit Logs</text>

  <!-- Sidebar section: TEMPLATES -->
  <text x="20" y="314" fill="#475569" font-size="10" font-weight="600" letter-spacing="1.2">TEMPLATES</text>
  <text x="26" y="338" fill="#64748B" font-size="13">📊 Dashboards</text>
  <text x="26" y="372" fill="#64748B" font-size="13">📝 Forms</text>
  <text x="26" y="406" fill="#64748B" font-size="13">📦 Data Tables</text>

  <!-- Sidebar: Connected Sources -->
  <text x="20" y="446" fill="#475569" font-size="10" font-weight="600" letter-spacing="1.2">CONNECTED SOURCES</text>
  <rect x="12" y="455" width="196" height="44" rx="8" fill="#0F172A" stroke="#1F2937" stroke-width="1"/>
  <circle cx="30" cy="477" r="8" fill="#16A34A"/>
  <text x="24" y="481" fill="#FFFFFF" font-size="9" font-weight="700">PG</text>
  <text x="44" y="474" fill="#E2E8F0" font-size="12" font-weight="500">Olist E-Commerce</text>
  <text x="44" y="490" fill="#4ADE80" font-size="10">● Connected · 12 tables</text>

  <!-- Sidebar bottom: User info -->
  <rect x="0" y="840" width="220" height="60" fill="#0D1526"/>
  <line x1="0" y1="840" x2="220" y2="840" stroke="#1F2937" stroke-width="1"/>
  <circle cx="28" cy="870" r="16" fill="#1E3A8A"/>
  <text x="20" y="875" fill="#93C5FD" font-size="13" font-weight="600">SR</text>
  <text x="50" y="867" fill="#E2E8F0" font-size="13" font-weight="500">Subham Rai</text>
  <text x="50" y="882" fill="#64748B" font-size="11">ops_analyst · Free Plan</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MAIN CANVAS AREA                             -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="220" y="64" width="1220" height="836" fill="#0A0F1E"/>

  <!-- Page title -->
  <text x="260" y="110" fill="#F8FAFC" font-size="22" font-weight="700">Build a New Application</text>
  <text x="260" y="134" fill="#64748B" font-size="14">Start with AI or choose a template — your canvas is ready below</text>

  <!-- KPI Row -->
  <!-- Card 1: Total Orders -->
  <rect x="260" y="152" width="190" height="80" rx="10" fill="url(#cardBlue)" stroke="#1E3A8A" stroke-width="1"/>
