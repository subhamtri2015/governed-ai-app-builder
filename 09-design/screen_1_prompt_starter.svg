  <text x="890" y="210" fill="#F8FAFC" font-size="24" font-weight="700">12.5 days</text>
  <text x="890" y="226" fill="#EF4444" font-size="11">↓ 2.1d above SLA</text>

  <!-- Empty Canvas Placeholder -->
  <rect x="260" y="248" width="1120" height="420" rx="12" fill="#0D1526" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 4"/>
