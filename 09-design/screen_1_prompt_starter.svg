    <rect x="1224" y="424" width="76" height="20" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <text x="1232" y="438" fill="#475569" font-size="10">payments</text>
    <text x="1306" y="438" fill="#475569" font-size="10" opacity="0.6">+7 more</text>

