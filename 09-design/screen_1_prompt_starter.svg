  <circle cx="1000" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1040" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1080" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1120" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1160" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1200" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1240" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1280" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="1320" cy="308" r="1.5" fill="#1E293B"/>
  <circle cx="320" cy="348" r="1.5" fill="#1E293B"/>
  <circle cx="360" cy="348" r="1.5" fill="#1E293B"/>
  <circle cx="400" cy="348" r="1.5" fill="#1E293B"/>
  <circle cx="440" cy="348" r="1.5" fill="#1E293B"/>
  <circle cx="480" cy="348" r="1.5" fill="#1E293B"/>
  <circle cx="320" cy="388" r="1.5" fill="#1E293B"/>
