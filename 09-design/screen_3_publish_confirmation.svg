<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="publishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="modalShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="#1E293B"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="14" fill="#3B82F6"/>
  <text x="31" y="37" fill="#FFFFFF" font-size="14" font-weight="bold">AI</text>
  <text x="62" y="38" fill="#F8FAFC" font-size="16" font-weight="600">InternalBuilder Studio — Orders Fulfillment App</text>
  <rect x="520" y="20" width="130" height="24" rx="12" fill="#1E3A8A"/>
  <text x="532" y="36" fill="#93C5FD" font-size="12">Draft v1.4 (Unpublished)</text>
  <rect x="1050" y="16" width="110" height="32" rx="6" fill="#16A34A"/>
  <text x="1070" y="36" fill="#FFFFFF" font-size="13" font-weight="600">Publish App</text>

  <!-- Canvas Background Showing Rendered Application -->
  <rect x="40" y="90" width="1120" height="670" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  
  <!-- Canvas Header -->
  <text x="70" y="130" fill="#F8FAFC" font-size="20" font-weight="bold">Orders Pending Delivery</text>
  <rect x="70" y="148" width="220" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="86" y="171" fill="#64748B" font-size="13">🔍 Search by order_id...</text>
  <rect x="306" y="148" width="130" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="322" y="171" fill="#94A3B8" font-size="13">Status: All (2)</text>

  <!-- Rendered Table Rows -->
  <rect x="70" y="200" width="1060" height="40" fill="#0F172A"/>
  <text x="90" y="225" fill="#94A3B8" font-size="12" font-weight="600">ORDER ID</text>
  <text x="360" y="225" fill="#94A3B8" font-size="12" font-weight="600">STATUS</text>
  <text x="540" y="225" fill="#94A3B8" font-size="12" font-weight="600">PURCHASE TIMESTAMP</text>
  <text x="820" y="225" fill="#94A3B8" font-size="12" font-weight="600">ESTIMATED DELIVERY</text>

  <!-- Row 1 -->
  <rect x="70" y="242" width="1060" height="46" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="90" y="270" fill="#F8FAFC" font-size="13" font-family="Courier, monospace">e481f51cbdc54678b7cc49136f2d6af7</text>
  <rect x="360" y="254" width="76" height="22" rx="11" fill="#854D0E"/>
  <text x="372" y="269" fill="#FEF08A" font-size="11" font-weight="600">shipped</text>
  <text x="540" y="270" fill="#CBD5E1" font-size="13">2017-10-02 10:56:33</text>
  <text x="820" y="270" fill="#CBD5E1" font-size="13">2017-10-18 00:00:00</text>

  <!-- Row 2 -->
  <rect x="70" y="290" width="1060" height="46" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="90" y="318" fill="#F8FAFC" font-size="13" font-family="Courier, monospace">53cdb2488a108157771d842583c442c2</text>
  <rect x="360" y="302" width="94" height="22" rx="11" fill="#1E3A8A"/>
  <text x="372" y="317" fill="#93C5FD" font-size="11" font-weight="600">processing</text>
  <text x="540" y="318" fill="#CBD5E1" font-size="13">2018-07-24 20:41:37</text>
  <text x="820" y="318" fill="#CBD5E1" font-size="13">2018-08-13 00:00:00</text>

  <!-- Dark Backdrop Overlay -->
  <rect x="0" y="0" width="1200" height="800" fill="#000000" opacity="0.6"/>

  <!-- Centered Publish Confirmation Dialog -->
  <g filter="url(#modalShadow)">
    <rect x="340" y="180" width="520" height="420" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>

    <!-- Modal Header -->
    <circle cx="600" cy="240" r="28" fill="#16A34A" opacity="0.2"/>
    <circle cx="600" cy="240" r="16" fill="#16A34A"/>
    <text x="593" y="246" fill="#FFFFFF" font-size="18" font-weight="bold">🚀</text>

    <text x="600" y="295" fill="#F8FAFC" font-size="20" font-weight="bold" text-anchor="middle">Publish Changes to Production?</text>
    <text x="600" y="322" fill="#94A3B8" font-size="13" text-anchor="middle">This will create a new live release accessible to your team.</text>

    <!-- Release Audit Summary Box -->
    <rect x="375" y="345" width="450" height="130" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <text x="395" y="375" fill="#CBD5E1" font-size="13" font-weight="600">Release Summary:</text>
    <text x="395" y="400" fill="#94A3B8" font-size="12">• AI Draft Changes:</text>
    <text x="535" y="400" fill="#4ADE80" font-size="12" font-weight="600">2 Parts Accepted (Query q1, Table c1)</text>
    
    <text x="395" y="424" fill="#94A3B8" font-size="12">• Rejected Proposals:</text>
    <text x="535" y="424" fill="#F87171" font-size="12">1 Part Discarded (Metric Card c2)</text>

    <text x="395" y="448" fill="#94A3B8" font-size="12">• Audit Trail ID:</text>
    <text x="535" y="448" fill="#38BDF8" font-size="12" font-family="Courier, monospace">aud_89312 (Logged to ai_draft_events)</text>

    <!-- Action Buttons -->
    <rect x="375" y="505" width="160" height="42" rx="8" fill="#334155"/>
    <text x="430" y="531" fill="#E2E8F0" font-size="14" font-weight="500">Back to Canvas</text>

    <rect x="555" y="505" width="270" height="42" rx="8" fill="url(#publishGrad)"/>
    <text x="585" y="531" fill="#FFFFFF" font-size="14" font-weight="600">Confirm &amp; Publish App →</text>
  </g>
</svg>
